<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-1">FlyTrack</h3>
          <p class="text-center text-muted mb-4">Crea tu cuenta</p>

          @if (error()) {
            <div class="alert alert-danger py-2">{{ error() }}</div>
          }

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre completo</label>
              <input type="text" class="form-control" [(ngModel)]="name" name="name" required
                placeholder="Juan Pérez" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" [(ngModel)]="email" name="email" required
                placeholder="tu@email.com" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Contraseña</label>
              <input type="password" class="form-control" [(ngModel)]="password" name="password"
                required minlength="6" placeholder="Mínimo 6 caracteres" />
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Tipo de cuenta</label>
              <select class="form-select" [(ngModel)]="role" name="role">
                <option value="PASSENGER">Pasajero</option>
                <option value="OPERATOR">Operador</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
              @if (loading()) { <span class="spinner-border spinner-border-sm me-1"></span> Registrando... }
              @else { Registrarse }
            </button>
          </form>

          <hr class="my-3" />
          <p class="text-center mb-0 small">
            ¿Ya tienes cuenta? <a routerLink="/login">Ingresa aquí</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
