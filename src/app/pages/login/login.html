<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-1">FlyTrack</h3>
          <p class="text-center text-muted mb-4">Ingresa a tu cuenta</p>

          @if (error()) {
            <div class="alert alert-danger py-2">{{ error() }}</div>
          }

          <form (ngSubmit)="onSubmit()" #f="ngForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" [(ngModel)]="email" name="email" required
                placeholder="tu@email.com" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Contraseña</label>
              <input type="password" class="form-control" [(ngModel)]="password" name="password" required
                placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
              @if (loading()) { <span class="spinner-border spinner-border-sm me-1"></span> Ingresando... }
              @else { Ingresar }
            </button>
          </form>

          <hr class="my-3" />
          <p class="text-center mb-0 small">
            ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
          </p>
          <p class="text-center mt-2 mb-0 small text-muted">
            Cuentas de prueba:<br />
            <code>admin@flytrack.com</code> / <code>admin123</code><br />
            <code>operador@flytrack.com</code> / <code>operador123</code><br />
            <code>pasajero@flytrack.com</code> / <code>pasajero123</code>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
